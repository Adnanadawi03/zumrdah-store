<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إتمام الشراء</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hdr"></header>
<main id="app">جاري التحميل...</main>
<div id="ftr"></div>
<script src="app.js"></script>
<script>
(async()=>{
  await loadStore();chrome("shop");
  const c=cart();
  if(!c.length){$("#app").innerHTML='<div class="box"><p class="mu">السلة فارغة.</p><a class="btn o" href="shop.html">تصفّح المنتجات</a></div>';return}
  const sub=c.reduce((s,x)=>s+x.unit*x.qty,0),S=STORE.settings;
  $("#app").innerHTML=`<div class="box">
    <h3>معلومات التوصيل</h3>
    <label>الاسم</label><input id="cn">
    <label>رقم الهاتف</label><input id="cp" type="tel" inputmode="tel" placeholder="07XXXXXXXX">
    <label>المحافظة</label><select id="cg">${GOV.map(g=>`<option>${g}</option>`).join("")}</select>
    <label>العنوان التفصيلي</label><textarea id="ca" rows="2"></textarea>
    ${S.code?`<label>كود الخصم (اختياري)</label><input id="cd">`:""}
    <div class="row"><span>المنتجات</span><span>${jd(sub)}</span></div>
    <div class="row"><span>الخصم</span><span id="ds">-</span></div>
    <div class="row"><span>التوصيل</span><span id="dl"></span></div>
    <div class="row tot"><span>الإجمالي</span><span id="gt"></span></div>
    <div class="row"><button class="btn" id="go">تأكيد الطلب</button><a class="btn o" href="cart.html">رجوع</a></div>
  </div>`;
  const disc=()=>S.code&&$("#cd")&&$("#cd").value.trim().toLowerCase()===S.code.toLowerCase()?+(sub*(+S.pct||0)/100).toFixed(2):0;
  const upd=()=>{const d=+STORE.delivery[$("#cg").value]||0,x=disc();$("#dl").textContent=jd(d);$("#ds").textContent=x?"-"+jd(x):"-";$("#gt").textContent=jd(sub-x+d)};
  $("#cg").onchange=upd;if($("#cd"))$("#cd").oninput=upd;upd();
  $("#go").onclick=async()=>{
    const name=$("#cn").value.trim(),phone=$("#cp").value.trim(),addr=$("#ca").value.trim(),gov=$("#cg").value;
    if(!name||!/^(\+?962|0)?7\d{8}$/.test(phone.replace(/\s/g,""))||!addr){toast("عبّي الاسم ورقم هاتف صحيح والعنوان");return}
    $("#go").disabled=true;
    try{
      await api("POST","/api/orders",{name,phone,gov,addr,code:$("#cd")?$("#cd").value:"",items:c.map(x=>({pid:x.pid,addons:x.addons,qty:x.qty}))});
      setCart([]);
      $("#app").innerHTML=`<div class="box" style="text-align:center"><h3>✅ تم استلام طلبك</h3><p>شكراً ${esc(name)}، رح نتواصل معك على ${esc(phone)} لتأكيد التوصيل.</p><a class="btn" href="index.html">الصفحة الرئيسية</a></div>`;
    }catch(e){toast(e.message);$("#go").disabled=false}
  };
})();
</script>
</body>
</html>
