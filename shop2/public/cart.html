<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zumrdah | السلة</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hdr"></header>
<main id="app">جاري التحميل...</main>
<div id="ftr"></div>
<script src="app.js"></script>
<script>
function render(){
  const c=cart();
  if(!c.length){$("#app").innerHTML='<div class="box"><h3>السلة</h3><p class="mu">السلة فارغة.</p><a class="btn o" href="shop.html">تصفّح المنتجات</a></div>';return}
  const sub=c.reduce((s,x)=>s+x.unit*x.qty,0);
  $("#app").innerHTML=`<div class="box">
    <h3>السلة</h3>
    ${c.map((x,i)=>`<div class="row"><div>${esc(x.name)} × ${x.qty}<div class="mu">${esc(x.addons.join("، "))}</div></div><div>${jd(x.unit*x.qty)} <button class="btn r s" data-i="${i}">✕</button></div></div>`).join("")}
    <div class="row tot"><span>المجموع</span><span>${jd(sub)}</span></div>
    <div class="row"><a class="btn" href="checkout.html">إتمام الشراء</a><a class="btn o" href="shop.html">متابعة التسوق</a></div>
  </div>`;
  $("#app").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const c=cart();c.splice(+b.dataset.i,1);setCart(c);render();$("#cc").textContent=cartCount()});
}
(async()=>{await loadStore();chrome("shop");render()})();
</script>
</body>
</html>
