<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التاجر — المنتجات</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header id="hdr"></header>
<div class="admin-layout">
<nav id="adminSide" class="admin-side"></nav>
<main id="app">جاري التحميل...</main>
</div>
<div id="ftr"></div>
<script src="../app.js"></script>
<script src="admin.js"></script>
<script>
let products=[],tmpImgs=[],editId=null;
function stockBadge(p){
  if(p.stock===null||p.stock===undefined)return "";
  if(p.stock<=0)return ' <span class="tag c">نفذت الكمية</span>';
  return ` <span class="tag">متوفر: ${p.stock}</span>`;
}
function row(p){return `<div class="ord row"><span>${esc(p.name)} — ${p.addons&&p.addons.length?`<span class="mu">حسب الإضافة</span>`:jd(p.price)}${stockBadge(p)}</span><span><button class="btn o s" data-e="${p.id}">تعديل</button> <button class="btn r s" data-d="${p.id}">حذف</button></span></div>`}
function renderList(){
  if(!products.length){$("#list").innerHTML='<p class="mu">ما في منتجات، ابدأ بإضافة أول منتج.</p>';return}
  const groups={};
  products.forEach(p=>{const k=p.cat||"بدون تصنيف";(groups[k]=groups[k]||[]).push(p)});
  const order=[...STORE.settings.cats.filter(c=>groups[c]),...Object.keys(groups).filter(k=>!STORE.settings.cats.includes(k))];
  $("#list").innerHTML=order.map(k=>`<h3 style="margin:18px 0 8px;font-weight:400">${esc(k)} <span class="mu">(${groups[k].length})</span></h3>${groups[k].map(row).join("")}`).join("");
  $("#list").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>openForm(b.dataset.e));
  $("#list").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("حذف المنتج؟")){await api("DELETE","/api/products/"+b.dataset.d);await refresh()}});
}
function openForm(id){
  editId=id||null;
  const p=products.find(x=>x.id===id)||{name:"",price:"",imgs:[],addons:[],cat:""};
  tmpImgs=[...(p.imgs||[])];
  $("#form").style.display="block";
  $("#form").innerHTML=`<h3>${id?"تعديل":"إضافة"} منتج</h3>
    <label>الاسم</label><input id="pn" value="${esc(p.name)}">
    <label>السعر (د.أ) — اتركه فاضي إذا في درجات/خيارات بأسعار مختلفة بالأسفل</label><input id="pp" type="number" step="0.25" min="0" value="${p.price||""}" placeholder="اختياري إذا في إضافات">
    <label>الكمية المتوفرة — اتركها فاضية إذا الكمية غير محدودة</label><input id="pst" type="number" min="0" step="1" value="${p.stock??""}" placeholder="غير محدودة">
    <label>التصنيف</label><select id="pc"><option value="">— بدون —</option>${STORE.settings.cats.map(c=>`<option ${p.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <label>الصور (حتى 3)</label><input id="pf" type="file" accept="image/*" multiple><div class="imgs" id="pi"></div>
    <label>الإضافات / الدرجات — كل سطر: الاسم | السعر</label><textarea id="pa" rows="3" placeholder="درجة فاتحة | 5&#10;درجة غامقة | 6">${esc((p.addons||[]).map(x=>x.name+" | "+x.price).join("\n"))}</textarea>
    <div class="row"><button class="btn" id="ps">حفظ</button><button class="btn o" id="pcancel">إلغاء</button></div>`;
  const showI=()=>$("#pi").innerHTML=tmpImgs.map((s,i)=>`<img src="${s}" data-ri="${i}" title="اضغط للحذف">`).join("");showI();
  $("#pi").onclick=e=>{const i=e.target.dataset.ri;if(i!==undefined){tmpImgs.splice(+i,1);showI()}};
  $("#pf").onchange=async e=>{for(const f of [...e.target.files].slice(0,3-tmpImgs.length))tmpImgs.push(await shrink(f));showI()};
  $("#pcancel").onclick=closeForm;
  $("#ps").onclick=async()=>{
    const name=$("#pn").value.trim();
    const addons=$("#pa").value.split("\n").map(l=>l.split("|")).filter(x=>x[0].trim()).map(x=>({name:x[0].trim(),price:+(x[1]||0)||0}));
    const priceRaw=$("#pp").value.trim();
    if(!name){toast("اكتب اسم المنتج");return}
    if(priceRaw===""&&addons.length===0){toast("السعر إجباري إذا ما في إضافات/درجات للمنتج");return}
    if(priceRaw!==""&&!(+priceRaw>=0)){toast("السعر غير صالح");return}
    const price=priceRaw===""?0:+priceRaw;
    const stockRaw=$("#pst").value.trim();
    if(stockRaw!==""&&!(+stockRaw>=0)){toast("الكمية غير صالحة");return}
    const stock=stockRaw===""?null:Math.floor(+stockRaw);
    try{await api("PUT","/api/products/"+(editId||uid()),{name,price,stock,cat:$("#pc").value,imgs:tmpImgs,addons});closeForm();await refresh();toast("تم الحفظ")}catch(e){toast(e.message)}
  };
}
function closeForm(){$("#form").style.display="none";$("#form").innerHTML=""}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,400/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};i.src=URL.createObjectURL(f)})}
async function refresh(){await loadStore();products=STORE.products;renderList()}
(async()=>{
  if(!await requireAdmin())return;
  await loadStore();adminChrome("products.html");products=STORE.products;
  $("#app").innerHTML=`<button class="btn" id="add">+ منتج جديد</button><div id="form" style="display:none;margin-top:12px" class="box"></div><div id="list" style="margin-top:12px"></div>`;
  $("#add").onclick=()=>openForm(null);
  renderList();
})();
</script>
</body>
</html>
