<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التاجر — أسعار التوصيل</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header id="hdr"></header>
<div class="admin-layout">
<nav id="adminSide" class="admin-side"></nav>
<main id="app">جاري التحميل...</main>
</div>
<div id="ftr"></div>
<script src="../app.js"></script>
<script src="admin.js"></script>
<script>
(async()=>{
  if(!await requireAdmin())return;
  await loadStore();adminChrome("delivery.html");
  const d=STORE.delivery;
  $("#app").innerHTML=`<div class="ord">${GOV.map((g,i)=>`<div class="row"><span>${g}</span><input type="number" step="0.5" min="0" style="width:100px" data-g="${i}" value="${d[g]}"></div>`).join("")}<button class="btn" id="sd" style="margin-top:8px">حفظ الأسعار</button></div>`;
  $("#sd").onclick=async()=>{
    const o={};document.querySelectorAll("[data-g]").forEach((el,i)=>o[GOV[i]]=+el.value||0);
    try{await api("PUT","/api/delivery",o);toast("تم حفظ أسعار التوصيل")}catch(e){toast(e.message)}
  };
})();
</script>
</body>
</html>
